# Configuração do Nginx dentro do container.
# Ele serve o public/ do Laravel e repassa o PHP para o PHP-FPM local.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs vão para stdout/stderr para o EasyPanel capturar.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile        on;
    keepalive_timeout 65;

    # Compressão — reduz o tamanho do CSS/JS do Vue.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name _;

        # O document root aponta para public/, nunca para a raiz.
        # Isso protege o .env e o código-fonte de acesso externo.
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Cabeçalhos de segurança básicos.
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        # Tenta o arquivo estático primeiro; se não existir, vai para o Laravel.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Repassa as requisições .php para o PHP-FPM rodando em localhost:9000.
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Bloqueia acesso a arquivos ocultos (.env, .git, etc).
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Cache agressivo para os assets do Vite (têm hash no nome).
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}